spring:
  application:
    name: "configserver"
  profiles:
    active: native
#    active: git
  cloud:
    config:
      server:
        native:
          search-locations: "classpath:/config"
#        git:
#          uri: https://github.com/ducnm229/ab-ms.git
#          search-paths: ab-ms-config
#          username: ducnm229
#          password: access_token
#          default-label: main
#          timeout: 5
#          clone-on-start: false # clone the repo into local system during startup
#          force-pull: false # always override local changes with values from the repo

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"

server:
  port: 8071